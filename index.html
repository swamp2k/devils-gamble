<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#120908" />
  <title>Devil's Gamble</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="modular.css" />
</head>
<body>
  <div class="embers" aria-hidden="true"></div>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♠</span>
        <div>
          <h1>DEVIL'S GAMBLE</h1>
          <p>Guess the Devil. Save the idiot.</p>
        </div>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div><span>BANK</span><strong id="bank">0</strong></div>
        <div class="pot-stat"><span>POT</span><strong id="pot">0</strong></div>
        <div><span>STREAK</span><strong id="streak">0</strong></div>
      </div>
    </header>

    <section class="question-copy">
      <span class="eyebrow">THE DEVIL ASKS</span>
      <h2 id="questionText"></h2>
    </section>

    <section class="table" id="table">
      <button class="choice-card left" id="leftCard" type="button" aria-keyshortcuts="A ArrowLeft 1">
        <span class="card-corner">A</span>
        <span class="choice-text" id="leftText"></span>
        <span class="choose">A / ←</span>
      </button>

      <div class="danger-stage" id="dangerStage" aria-live="polite">
        <div class="contraption-label" id="contraptionLabel"></div>
        <div class="contraption" id="contraption">
          <div class="hazard hazard-top" id="hazardTop"></div>
          <div class="victim modular-victim" id="victim" role="img" aria-label="Unfortunate modular contestant">
            <img class="body-part neck" src="assets/modular/tint1_neck.svg" alt="" />
            <img class="body-part torso" src="assets/modular/redShirt1.svg" alt="" />
            <img class="body-part hips" src="assets/modular/pantsLightBlue3.svg" alt="" />

            <div class="body-part head-group" data-body-part="head">
              <img class="head-base" src="assets/modular/tint1_head.svg" alt="" />
              <img class="face" src="assets/modular/face1.svg" alt="" />
              <img class="hair" src="assets/modular/brown2Man5.svg" alt="" />
            </div>

            <div class="body-part arm-group arm-left" data-body-part="left-arm">
              <img class="sleeve" src="assets/modular/redArm_long.svg" alt="" />
              <img class="hand" src="assets/modular/tint1_hand.svg" alt="" />
            </div>
            <div class="body-part arm-group arm-right" data-body-part="right-arm">
              <img class="sleeve" src="assets/modular/redArm_long.svg" alt="" />
              <img class="hand" src="assets/modular/tint1_hand.svg" alt="" />
            </div>

            <div class="body-part leg-group leg-left" data-body-part="left-leg">
              <img class="trouser-leg" src="assets/modular/pantsLightBlue_long.svg" alt="" />
              <img class="shoe" src="assets/modular/brownShoe5.svg" alt="" />
            </div>
            <div class="body-part leg-group leg-right" data-body-part="right-leg">
              <img class="trouser-leg" src="assets/modular/pantsLightBlue_long.svg" alt="" />
              <img class="shoe" src="assets/modular/brownShoe5.svg" alt="" />
            </div>
          </div>
          <div class="hazard hazard-bottom" id="hazardBottom"></div>
          <div class="impact-flash" aria-hidden="true"></div>
        </div>
        <div class="victim-name" id="victimName"></div>

        <div class="verdict hidden" id="verdict" aria-live="assertive">
          <strong id="verdictTitle"></strong>
          <div class="verdict-actions" id="verdictActions"></div>
        </div>
      </div>

      <button class="choice-card right" id="rightCard" type="button" aria-keyshortcuts="B ArrowRight 2">
        <span class="card-corner">B</span>
        <span class="choice-text" id="rightText"></span>
        <span class="choose">B / →</span>
      </button>
    </section>

    <section class="dealer-strip" aria-live="polite">
      <span class="devil-avatar" aria-hidden="true">😈</span>
      <strong id="dealerName">YOUR DEALER</strong>
      <span class="dealer-line" id="dealerLine">Two cards. One opinion. Try not to disappoint me.</span>
    </section>

    <section class="utility-row" aria-label="Dubious assistance">
      <div class="cheats">
        <button type="button" id="peekBtn" title="Briefly reveal the Devil's preferred card">PEEK <small>250</small></button>
        <button type="button" id="rerollBtn" title="Discard both cards">REROLL <small>500</small></button>
        <button type="button" id="insuranceBtn" title="Protect the current pot from one loss">INSURE <small>1000</small></button>
      </div>
      <button type="button" class="text-button" id="newRunBtn">NEW DEALER</button>
    </section>

    <footer><span id="runHint">The house always wins. Eventually.</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
