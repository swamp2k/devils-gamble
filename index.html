<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#120908" />
  <title>Devil's Gamble</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="embers" aria-hidden="true"></div>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♠</span>
        <div>
          <h1>DEVIL'S GAMBLE</h1>
          <p>Guess what the Devil would choose.</p>
        </div>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div><span>HELL CHIPS</span><strong id="bank">0</strong></div>
        <div><span>POT</span><strong id="pot">0</strong></div>
        <div><span>STREAK</span><strong id="streak">0</strong></div>
      </div>
    </header>

    <section class="dealer-panel">
      <div class="devil-avatar" aria-hidden="true">😈</div>
      <div class="dealer-copy">
        <span class="eyebrow" id="dealerName">YOUR DEALER</span>
        <p id="dealerLine">Two cards. One opinion. Try not to disappoint me.</p>
      </div>
    </section>

    <section class="table" id="table">
      <button class="choice-card left" id="leftCard" type="button">
        <span class="card-corner">A</span>
        <span class="choice-text" id="leftText"></span>
        <span class="choose">CHOOSE</span>
      </button>

      <div class="danger-stage" id="dangerStage" aria-live="polite">
        <div class="contraption-label" id="contraptionLabel"></div>
        <div class="contraption" id="contraption">
          <div class="hazard hazard-top" id="hazardTop"></div>
          <div class="victim" id="victim" role="img" aria-label="Unfortunate contestant">
            <div class="victim-head"></div>
            <div class="victim-body"></div>
            <div class="victim-arm left-arm"></div>
            <div class="victim-arm right-arm"></div>
            <div class="victim-leg left-leg"></div>
            <div class="victim-leg right-leg"></div>
          </div>
          <div class="hazard hazard-bottom" id="hazardBottom"></div>
        </div>
        <div class="victim-name" id="victimName"></div>
      </div>

      <button class="choice-card right" id="rightCard" type="button">
        <span class="card-corner">B</span>
        <span class="choice-text" id="rightText"></span>
        <span class="choose">CHOOSE</span>
      </button>
    </section>

    <section class="question-copy">
      <span class="eyebrow">THE QUESTION</span>
      <h2 id="questionText"></h2>
    </section>

    <section class="result-panel hidden" id="resultPanel" aria-live="polite">
      <div>
        <span class="eyebrow" id="resultEyebrow">VERDICT</span>
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>
      </div>
      <div class="result-actions" id="resultActions"></div>
    </section>

    <section class="cheats" aria-label="Dubious assistance">
      <button type="button" id="peekBtn">PEEK <small>250</small></button>
      <button type="button" id="rerollBtn">REROLL <small>500</small></button>
      <button type="button" id="insuranceBtn">INSURANCE <small>1000</small></button>
    </section>

    <footer>
      <span id="runHint">The house always wins. Eventually.</span>
      <button type="button" class="text-button" id="newRunBtn">NEW DEALER</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
